# CI (FREE-TIER.md §2 GitHub row): cancel superseded runs, path filters, pnpm + Docker caching,
# so the private repo stays well under 2,000 Actions minutes a month.
name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL_OWNER_TEST: postgres://neondb_owner:owner@localhost:5433/edf_test
      APP_RW_PASSWORD: ci-app-rw-password-not-secret-0001
      # The DB/RLS suites must run here: test/env.ts throws instead of skipping them when the test
      # database env is missing (turbo.json's test task passes these variables through).
      EDF_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Neon-like roles (non-superuser owner with BYPASSRLS, as on Neon)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5433 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE neon_superuser NOLOGIN BYPASSRLS CREATEDB CREATEROLE;
          CREATE ROLE neondb_owner LOGIN PASSWORD 'owner' BYPASSRLS CREATEDB CREATEROLE IN ROLE neon_superuser;
          CREATE DATABASE edf_test OWNER neondb_owner;
          SQL
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # next build, the Sandbox render bundle and the edf-view function bundles.
      - run: pnpm build
      - name: Committed edf-view bundles match their sources (packages/crypto/DECISIONS.md D-V5)
        run: |
          git diff --exit-code -- apps/view/api apps/view/public
          test -z "$(git status --porcelain -- apps/view/api apps/view/public)" || { git status --porcelain -- apps/view/api apps/view/public; exit 1; }
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
